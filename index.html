<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們相識的日子</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .date-input-group {
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-size: 0.95rem;
    }
    input[type="date"] {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="date"]:focus {
      border-color: #6c5ce7;
    }
    .result-container {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 1rem;
    }
    .days-count {
      font-size: 3rem;
      font-weight: bold;
      color: #6c5ce7;
      line-height: 1.2;
    }
    .days-label {
      color: #777;
      margin-top: 5px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💕 我們相識的時間</h1>
    
    <div class="date-input-group">
      <label for="startDate">設定認識的日期：</label>
      <input type="date" id="startDate">
    </div>

    <div class="result-container">
      <div>我們已經相識了</div>
      <div class="days-count" id="daysCount">0</div>
      <div class="days-label" id="detailedText">天</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
